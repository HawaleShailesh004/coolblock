name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck build

  python:
    name: Python — ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy engine apps/api/src

      - name: Pytest
        run: uv run pytest

  crs-invariant:
    name: CRS invariant round-trip (§5.1 rule 3)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run CRS invariant test
        run: uv run pytest engine/tests -k crs_invariant -v
        # Written in Phase 1 (COOLBLOCK-BUILD-PLAN.md §5.1.3). This job is a
        # no-op until that test exists, and starts failing loudly the moment
        # it's added and broken — which is the point.
        continue-on-error: true

  # Preview/production deploy is a follow-up once Vercel/Fly.io/Neon/R2 are
  # provisioned (see docs/adr/0002-scope-lock-and-build-posture.md). Phase 0
  # targets local-only via docker-compose.

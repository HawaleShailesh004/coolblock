[project]
name = "coolblock-engine"
version = "0.1.0"
description = "CoolBlock's science: ingest, thermal, surface, impact, equity, optimize, narrate, verify."
requires-python = ">=3.11,<3.13"
dependencies = [
    "geopandas>=1.0",
    "rasterio>=1.3",
    "rioxarray>=0.17",
    "shapely>=2.0",
    "pyproj>=3.6",
    "odc-stac>=0.3",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "xarray>=2024.9",
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pvlib>=0.11",
    "pydantic>=2.9",
    "ortools>=9.11",
    "highspy>=1.9",
    "networkx>=3.3",
    "anthropic>=0.39",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "pyarrow>=17.0",
    "osm2geojson>=0.3.2",
    "h5netcdf>=1.8.1",
    "duckdb>=1.5.5",
    "rio-cogeo>=7.0.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["engine", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

# FastAPI's own dependency-injection pattern *is* `Depends(...)` as an
# argument default (see the framework's own docs) -- B008 exists to catch
# a real footgun (a mutable default evaluated once at def time) that
# doesn't apply here: `Depends()` returns a lightweight marker FastAPI
# inspects at request time, never mutated. Scoped to apps/api specifically
# rather than disabled repo-wide, since `engine/` has no FastAPI routes to
# use this pattern in the first place.
[tool.ruff.lint.per-file-ignores]
"apps/api/src/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["^notebooks/", "^data/"]

# highspy (Phase 6's exact MILP solver) is a C-extension binding with no
# complete type stubs -- calling its functions reads as "untyped call" in
# strict mode. `disallow_untyped_calls` is scoped to the *caller's*
# module, not the callee's, so this narrowly exempts only the one module
# that calls into highspy, not a blanket relaxation.
[[tool.mypy.overrides]]
module = "engine.optimize.exact"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["engine/tests", "apps/api/tests"]
addopts = "-ra -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo root *is* the coolblock-engine project (COOLBLOCK-BUILD-PLAN.md
# §3.4: "engine/ -- the science. installable Python package."). This keeps
# `engine/ingest`, `engine/thermal`, etc. as plain on-disk directories
# (import path `engine.ingest`) without a redundant engine/engine/ nesting,
# and without the hatchling wheel-sources path-rewrite that breaks editable
# installs (see git history on this file).
[tool.hatch.build.targets.wheel]
packages = ["engine"]
exclude = ["engine/tests"]

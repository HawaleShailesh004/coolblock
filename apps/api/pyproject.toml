[project]
name = "coolblock-api"
version = "0.1.0"
description = "CoolBlock FastAPI service: REST + SSE + job control."
requires-python = ">=3.11,<3.13"
dependencies = [
    "coolblock-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "arq>=0.26",
    # Already present transitively via the anthropic/groq SDKs; declared
    # explicitly because the solve path imports it directly to wake the
    # worker (see Settings.worker_wake_url).
    "httpx>=0.27",
    "redis>=5.1",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.15",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.uv.sources]
coolblock-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coolblock_api"]

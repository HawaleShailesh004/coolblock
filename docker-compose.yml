name: coolblock

services:
  postgres:
    build: ./infra/postgres
    image: coolblock-postgres-pgvector:16-3.4
    container_name: coolblock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coolblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coolblock}
      POSTGRES_DB: ${POSTGRES_DB:-coolblock}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coolblock} -d ${POSTGRES_DB:-coolblock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coolblock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: coolblock-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-coolblock}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-coolblock123}
    ports:
      - "9000:9000"   # S3 API (local stand-in for Cloudflare R2)
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: coolblock-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-coolblock} ${S3_SECRET_ACCESS_KEY:-coolblock123} &&
      mc mb -p local/coolblock-data &&
      mc mb -p local/coolblock-tiles &&
      mc anonymous set download local/coolblock-tiles &&
      exit 0
      "

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: coolblock-titiler
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-coolblock}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-coolblock123}
      AWS_S3_ENDPOINT: minio:9000
      AWS_HTTPS: "false"
      AWS_VIRTUAL_HOSTING: "false"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.TIF,.tiff"
      PORT: 8090
    ports:
      - "8090:8090"
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8090"]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
